# /etc/nginx/sites-available/childcare
#
# Option A — own subdomain (childcare.example.com). Use this one if you can.
# Option B is further down if you'd rather hang it off a path on an existing host.

server {
    listen 443 ssl http2;
    server_name childcare.example.com;

    ssl_certificate     /etc/letsencrypt/live/childcare.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/childcare.example.com/privkey.pem;

    # The state API is unauthenticated by design — it's a single shared
    # setup, not per-user accounts. Keep it off the public internet, or put
    # auth in front of it (see the auth_request block below).
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    client_max_body_size 1m;    # state payloads are a few KB
}

server {
    listen 80;
    server_name childcare.example.com;
    return 301 https://$host$request_uri;
}


# ----------------------------------------------------------------------
# Option B — subpath on an existing host, e.g. https://home.example.com/childcare/
#
# The page calls "api/state" relatively, so it works under a subpath with no
# changes. The trailing slashes on both the location and proxy_pass matter.
#
#   location /childcare/ {
#       proxy_pass http://127.0.0.1:8099/;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# Visit it as /childcare/ with the trailing slash, or add:
#   location = /childcare { return 301 /childcare/; }


