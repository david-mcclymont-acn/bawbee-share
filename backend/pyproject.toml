[project]
name = "bawbee"
version = "0.1.0"
description = "A Wee Bawbee: household budgets, what-ifs, payday transfers and bank sync"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=25.1.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # test-only credentials
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette nudges towards httpx2; the TestClient still works with httpx.
    "ignore:Using `httpx` with `starlette.testclient`",
]
