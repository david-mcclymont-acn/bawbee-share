# Install once: uvx pre-commit install   (or: pip install pre-commit && pre-commit install)
# Run everything: uvx pre-commit run --all-files
# mypy, eslint and prettier use the project toolchains, so run `uv sync` in backend/ and
# `npm ci` in frontend/ first.

# The Impeccable skill is vendored as installed (`npx impeccable install`); leave its files
# byte-for-byte so updates diff cleanly. gitleaks still scans it (it reads the staged diff).
exclude: ^\.claude/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(seed|reference)/
      - id: end-of-file-fixer
        exclude: ^(seed|reference)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # JSONC (comments allowed)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Python and frontend hooks use the versions pinned in uv.lock / package-lock.json, so
  # pre-commit and CI always agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
