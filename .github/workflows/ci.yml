name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    # The real app, seeded, in a browser at 390px and 1440px (PLAN.md §11.2).
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      BAWBEE_DATABASE_URL: sqlite:////tmp/bawbee-e2e/bawbee.db
      BAWBEE_COOKIE_SECURE: "false"
      BAWBEE_PUBLIC_URL: http://127.0.0.1:8000
      E2E_PASSWORD: a wee bawbee for the bairn
      # The fake Demo Bank, so linking and syncing run end to end with no real bank.
      BAWBEE_BANKS_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Seed a database with both users
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -m app.cli migrate
          uv run python -m app.cli import-seed ../seed/budget-seed.json --as-of 2026-10-01
          for who in person_1 person_2; do
            echo "$E2E_PASSWORD" | uv run python -m app.cli user create "$who" --person "$who" --password-stdin
          done
      - name: Start the app
        working-directory: backend
        run: |
          # A throwaway encryption key for this run's demo bank link only.
          export BAWBEE_FERNET_KEY="$(uv run python -m app.cli fernet-key)"
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/bawbee-e2e.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat /tmp/bawbee-e2e.log; exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            frontend/screenshots/
            frontend/playwright-report/
          retention-days: 14
      - name: App log
        if: failure()
        run: cat /tmp/bawbee-e2e.log

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose

  compose:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: |
          # Plain HTTP in CI, so let the session cookie travel without TLS.
          echo "BAWBEE_COOKIE_SECURE=false" > .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: /health responds
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: /api/version names the commit the image was built from
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/version | tee /dev/stderr \
            | python3 -c "import json,os,sys; v=json.load(sys.stdin); assert v['commit'] == os.environ['GITHUB_SHA'], v; assert v['schema_revision'], v"
      - name: Placeholder page is served and styled
        run: |
          page=$(curl --fail --silent --show-error http://127.0.0.1:8000/)
          echo "$page" | grep -q '<div id="root">'
          css=$(echo "$page" | grep -o '/assets/[^"]*\.css' | head -1)
          test -n "$css"
          curl --fail --silent --show-error -o /dev/null "http://127.0.0.1:8000$css"
          curl --fail --silent --show-error http://127.0.0.1:8000/some/client/route | grep -q '<div id="root">'
      - name: Worker is running
        run: |
          test "$(docker inspect -f '{{.State.Running}}' bawbee-worker)" = true
          for _ in $(seq 20); do
            docker compose logs bawbee-worker | grep -q 'worker alive' && exit 0
            sleep 1
          done
          exit 1
      - name: Seed, sign in, and the summary API answers
        run: |
          docker compose exec -T bawbee-app bawbee import-seed - --no-cleanups < seed/budget-seed.json
          echo "a smoke test password" | docker compose exec -T bawbee-app bawbee user create ci --password-stdin
          curl --fail --silent --show-error -c /tmp/jar -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"a smoke test password"}' http://127.0.0.1:8000/api/auth/login > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/versions)" = 401
          live=$(curl --fail --silent --show-error -b /tmp/jar http://127.0.0.1:8000/api/versions | python3 -c "import json,sys; print(next(v['id'] for v in json.load(sys.stdin) if v['type']=='live'))")
          curl --fail --silent --show-error -b /tmp/jar "http://127.0.0.1:8000/api/versions/$live/summary" | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['version']['name'] == 'Maternity', s['version']
          assert s['joint_total_pence'] == 330750, s['joint_total_pence']
          assert s['surpluses'] == {'personal': {'person_1': 51080, 'person_2': -13005}, 'joint': 6250, 'household': 44325}, s['surpluses']
          print('summary ok:', s['surpluses'])
          "
      - name: Logs
        if: always()
        run: docker compose logs
      - name: docker compose down
        if: always()
        run: docker compose down -v
